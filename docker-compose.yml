services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: studentstats-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "StudentStats2026"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "StudentStats2026" -C -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 10

  init-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "StudentStats2026" -C -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = 'StudentStats') CREATE DATABASE StudentStats"

volumes:
  sqlserver_data:
